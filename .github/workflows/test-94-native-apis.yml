# File: .github/workflows/test-94-native-apis.yml
#
# Purpose
# -------
# Validate 94_Native_API's Python source syntax and run the regression suites
# maintained for every currently versioned Native API release.
#
# Communication / relationships
# -----------------------------
# Independent GitHub Actions workflow; reports results to commits and PRs.
# Each API version is tested independently so failures remain attributable
# to the version whose implementation or compatibility contract changed.
# Saves diagnostic logs and reports as seven-day workflow artifacts.
#
# Settings / parameters
# ---------------------
# Python 3.14 on Ubuntu.
# v1, v2, and v3 execute as separate matrix jobs with version-scoped
# working directories and PYTHONPATH values.
# Triggers on Native API changes, this workflow, or manual dispatch.
#
# Edge cases
# ----------
# Missing Python source, missing tests, collection errors, test failures,
# and all-skipped suites fail the affected version job.
# Individual conditional skips remain visible; no tests are filtered out.
# A failure in one API generation does not prevent GitHub Actions from
# reporting the independently executed results of the other matrix jobs.
#
# Known limitations
# -----------------
# Installs pytest for CI only; application dependencies are not inferred.
# Syntax checks are not behavioral tests.
# Passing version suites validates only behavior represented by the
# repository's tests; it is not coverage or security certification.
# Compatibility claims are limited to compatibility behavior actually
# exercised by the version-specific regression suites.
#
# Examples
# --------
# Edit 94_Native_API's/v1/, v2/, or v3/, or run this workflow manually
# from GitHub Actions.

name: 94 | Native APIs | Versioned Regression Tests

'on':
  push:
    branches:
      - main
    paths:
      - "94_Native_API's/**"
      - .github/workflows/test-94-native-apis.yml

  pull_request:
    branches:
      - main
    paths:
      - "94_Native_API's/**"
      - .github/workflows/test-94-native-apis.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 | ${{ matrix.api_version }} | Syntax and regression tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api_version:
          - v1
          - v2
          - v3

    defaults:
      run:
        shell: bash
        working-directory: "94_Native_API's/${{ matrix.api_version }}"

    env:
      PYTHONUNBUFFERED: '1'
      PROJECT_LABEL: 94 | Native APIs | ${{ matrix.api_version }} | Python Tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Prepare reports and show Python environment
        run: |
          REPORT_DIR="$RUNNER_TEMP/94-native-apis-${{ matrix.api_version }}-reports"
          printf 'REPORT_DIR=%s\n' "$REPORT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$REPORT_DIR"
          python --version

      - name: Install CI test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest --version

      - name: Check Python source syntax (does not execute application code)
        id: syntax
        run: |
          python - <<'PY'
          import os
          import tokenize
          from pathlib import Path

          excluded = {
              '.git',
              '.venv',
              'venv',
              '__pycache__',
              'build',
              'dist',
              'node_modules',
              'PROJECT_CONTEXT_EXPORTS',
          }

          files = [
              path
              for path in sorted(Path('.').rglob('*.py'))
              if not excluded.intersection(path.parts)
          ]

          if not files:
              raise SystemExit(
                  'No Python source files found in the configured API version.'
              )

          errors = []

          for path in files:
              try:
                  with tokenize.open(path) as handle:
                      compile(handle.read(), str(path), 'exec')
              except (SyntaxError, UnicodeError, OSError) as exc:
                  errors.append(f'{path}: {exc}')

          report = (
              f'Checked {len(files)} Python source files; '
              f'syntax errors: {len(errors)}\n'
          )
          report += '\n'.join(errors)

          print(report)

          (
              Path(os.environ['REPORT_DIR']) / 'syntax.txt'
          ).write_text(report, encoding='utf-8')

          if errors:
              raise SystemExit(1)
          PY

      - name: Verify regression-test directory exists
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('tests')

          if not root.is_dir():
              raise SystemExit(
                  'tests/ directory is missing: refusing to report success.'
              )

          tests = sorted(root.glob('test_*.py'))

          if not tests:
              raise SystemExit(
                  'No test_*.py regression modules found: '
                  'refusing to report success.'
              )

          print(f'Found {len(tests)} regression test modules.')
          PY

      - name: Collect tests and reject missing or broken suites
        id: collection
        run: |
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          set -o pipefail

          python -m pytest --collect-only -q 2>&1 \
            | tee "$REPORT_DIR/collection.log"

      - name: Run all discovered tests with names, skip reasons, and timings
        id: tests
        run: |
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          set -o pipefail

          python -m pytest \
            -vv \
            -ra \
            --tb=short \
            --durations=20 \
            --color=no \
            --junitxml="$REPORT_DIR/junit.xml" \
            2>&1 | tee "$REPORT_DIR/tests.log"

      - name: Publish result counts and reject all-skipped suites
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(os.environ['REPORT_DIR']) / 'junit.xml'

          if not path.exists():
              raise SystemExit(
                  'Test report missing; inspect the test step log.'
              )

          root = ET.parse(path).getroot()
          cases = list(root.iter('testcase'))

          counts = {'tests': len(cases)}

          for tag in ('failure', 'error', 'skipped'):
              counts[tag] = sum(
                  case.find(tag) is not None for case in cases
              )

          counts['passed'] = (
              counts['tests']
              - counts['failure']
              - counts['error']
              - counts['skipped']
          )

          lines = [
              '## ' + os.environ['PROJECT_LABEL'],
              '',
              '| Result | Count |',
              '| --- | ---: |',
          ]

          lines += [
              f'| {key} | {value} |'
              for key, value in counts.items()
          ]

          lines += [
              '',
              (
                  'Skipped includes pytest expected-failure outcomes, '
                  'if present.'
              ),
              (
                  'See the test log for test names, skip reasons, '
                  'and timings.'
              ),
          ]

          with open(
              os.environ['GITHUB_STEP_SUMMARY'],
              'a',
              encoding='utf-8',
          ) as handle:
              handle.write('\n'.join(lines) + '\n')

          if not cases:
              raise SystemExit(
                  'No tests reported: refusing to report success.'
              )

          if counts['tests'] == counts['skipped']:
              raise SystemExit(
                  'All tests were skipped: refusing to report success.'
              )
          PY

      - name: Save test logs and reports (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: 94-native-apis-${{ matrix.api_version }}-test-reports
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7
