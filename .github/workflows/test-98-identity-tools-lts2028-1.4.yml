# File: .github/workflows/test-98-identity-tools-lts2028-1.4.yml
#
# Purpose
# -------
# Validate 98_Tooling/Identity_Tools/LTS-2028 1.4.x source syntax and run its
# discovered regression tests against the linked BSR2
# (97_Encryption/Official). 1.4.x is the original LTS-2028 line plus the new
# encryption and the migration to it.
#
# Communication / relationships
# -----------------------------
# Independent GitHub Actions workflow; reports results to commits and PRs.
# One of three Identity Tools workflows, one per supported line:
#   LTS-2028 1.3.x  test-98-identity-tools-lts2028-1.3.yml
#   LTS-2028 1.4.x  test-98-identity-tools-lts2028-1.4.yml (this file)
#   Official        test-98-identity-tools-official.yml
# Saves diagnostic logs and reports as a seven-day workflow artifact.
#
# Settings / parameters
# ---------------------
# Python 3.14 on Ubuntu; working directory and PYTHONPATH are the 1.4.x root.
# Pushes and pull requests run the project's fast suite. Manual dispatch can
# select fast, slow, or all tests.
# Triggers on LTS-2028 1.4.x changes, BSR2 (97_Encryption/Official) changes
# (the linked dependency), this workflow, or manual dispatch.
#
# Edge cases
# ----------
# Missing suites, collection errors, test failures, and all-skipped suites fail.
# The checkout includes 97_Encryption, so the encryption link resolves in CI.
# The directory name contains a space, so its paths are quoted.
# Individual conditional skips remain visible; no tests are filtered out.
#
# Known limitations
# -----------------
# Uses the project's standard-library runner; no CI-only Python package is installed.
# Fast CI excludes production-cost KDF tests. Run the slow or all suite manually
# before a release that changes key derivation, keyring, or unlock behavior.
# Syntax checks are not behavioral tests. No coverage or security certification.
# Tk GUI tests use a virtual display; no platform matrix or build validation.
#
# Examples
# --------
# Edit 98_Tooling/Identity_Tools/LTS-2028 1.4.x/ or 97_Encryption/Official/, or run
# this workflow manually from Actions.

name: 98 | Identity Tools | LTS-2028 1.4 | Python Tests

'on':
  push:
    branches:
      - main
    paths:
      - "98_Tooling/Identity_Tools/LTS-2028 1.4.x/**"
      - 97_Encryption/Official/**
      - .github/workflows/test-98-identity-tools-lts2028-1.4.yml
  pull_request:
    branches:
      - main
    paths:
      - "98_Tooling/Identity_Tools/LTS-2028 1.4.x/**"
      - 97_Encryption/Official/**
      - .github/workflows/test-98-identity-tools-lts2028-1.4.yml
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: fast
        type: choice
        options:
          - fast
          - slow
          - all

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 | Syntax and regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: "98_Tooling/Identity_Tools/LTS-2028 1.4.x"
    env:
      PYTHONUNBUFFERED: '1'
      PROJECT_LABEL: 98 | Identity Tools | LTS-2028 1.4 | Python Tests
    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Prepare reports and show Python environment
        run: |
          REPORT_DIR="$RUNNER_TEMP/98-identity-tools-lts2028-1.4-reports"
          printf 'REPORT_DIR=%s\n' "$REPORT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$REPORT_DIR"
          python --version

      - name: Install virtual display infrastructure
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth

      - name: Verify Tk virtual-display support
        run: |
          xvfb-run --auto-servernum python - <<'PY'
          import tkinter as tk
          root = tk.Tk()
          root.withdraw()
          root.update_idletasks()
          print("Tk virtual-display preflight passed.")
          root.destroy()
          PY

      - name: Check Python source syntax (does not execute application code)
        id: syntax
        run: |
          python - <<'PY'
          import os
          import tokenize
          from pathlib import Path

          excluded = {'.git', '.venv', 'venv', '__pycache__', 'build', 'dist',
                      'node_modules', 'PROJECT_CONTEXT_EXPORTS'}
          files = [p for p in sorted(Path('.').rglob('*.py'))
                   if not excluded.intersection(p.parts)]
          if not files:
              raise SystemExit('No Python source files found in the configured project.')
          errors = []
          for path in files:
              try:
                  with tokenize.open(path) as handle:
                      compile(handle.read(), str(path), 'exec')
              except (SyntaxError, UnicodeError, OSError) as exc:
                  errors.append(f'{path}: {exc}')
          report = f'Checked {len(files)} Python source files; syntax errors: {len(errors)}\n'
          report += '\n'.join(errors)
          print(report)
          (Path(os.environ['REPORT_DIR']) / 'syntax.txt').write_text(report, encoding='utf-8')
          if errors:
              raise SystemExit(1)
          PY

      - name: Run selected project test suite with names and timings
        id: tests
        env:
          REQUESTED_SUITE: ${{ github.event.inputs.suite || 'fast' }}
        run: |
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          printf 'TEST_SUITE=%s\n' "$REQUESTED_SUITE" >> "$GITHUB_ENV"
          case "$REQUESTED_SUITE" in
            fast) SUITE_ARGS=(--fast) ;;
            slow) SUITE_ARGS=(--slow) ;;
            all) SUITE_ARGS=() ;;
            *) echo "Unsupported suite: $REQUESTED_SUITE" >&2; exit 2 ;;
          esac
          set -o pipefail
          xvfb-run --auto-servernum python -S tests/run_tests.py "${SUITE_ARGS[@]}" -v \
            2>&1 | tee "$REPORT_DIR/tests.log"

      - name: Publish result counts and reject incomplete suites
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['REPORT_DIR']) / 'tests.log'
          if not path.exists():
              raise SystemExit('Test log missing; inspect the test step.')
          text = path.read_text(encoding='utf-8', errors='replace')
          completed = re.findall(r'^Ran (\d+) tests? in ', text, re.MULTILINE)
          if not completed:
              raise SystemExit(
                  'The selected suite did not reach a unittest completion summary.'
              )
          tests = int(completed[-1])
          failure_match = re.findall(r'^FAILED \(([^)]*)\)', text, re.MULTILINE)
          values = {'failures': 0, 'errors': 0, 'skipped': 0}
          if failure_match:
              for item in failure_match[-1].split(','):
                  key, _, value = item.strip().partition('=')
                  if key in values and value.isdigit():
                      values[key] = int(value)
          else:
              skipped = re.findall(r'^OK \(skipped=(\d+)\)', text, re.MULTILINE)
              if skipped:
                  values['skipped'] = int(skipped[-1])
              elif not re.search(r'^OK$', text, re.MULTILINE):
                  raise SystemExit('The selected suite has no final OK or FAILED result.')
          passed = tests - sum(values.values())
          counts = {
              'tests': tests,
              'passed': passed,
              **values,
          }
          lines = [
              '## ' + os.environ['PROJECT_LABEL'],
              '',
              f"Suite: {os.environ.get('TEST_SUITE', 'fast')}",
              '',
              '| Result | Count |',
              '| --- | ---: |',
          ]
          lines += [f'| {key} | {value} |' for key, value in counts.items()]
          lines += [
              '',
              'See the test log for names, skip reasons, and timings.',
          ]
          with open(
              os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8'
          ) as handle:
              handle.write('\n'.join(lines) + '\n')
          if tests == values['skipped']:
              raise SystemExit('All tests were skipped: refusing to report success.')
          PY

      - name: Save test logs and reports (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: 98-identity-tools-lts2028-1.4-test-reports
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7

