# File: .github/workflows/test-98-archive-snapshot.yml
#
# Purpose
# -------
# Validate 98_Tooling/ArchiveSnapshot source syntax and run its discovered regression tests.
#
# Communication / relationships
# -----------------------------
# Independent GitHub Actions workflow; reports results to commits and PRs.
# Saves diagnostic logs and reports as a seven-day workflow artifact.
#
# Settings / parameters
# ---------------------
# Python 3.14 on Ubuntu; project-scoped working directory and PYTHONPATH.
# Triggers on project changes, this workflow, or manual dispatch.
#
# Edge cases
# ----------
# Missing suites, collection errors, test failures, and all-skipped suites fail.
# Individual conditional skips remain visible; no tests are filtered out.
#
# Known limitations
# -----------------
# Installs pytest for CI only; application dependencies are not inferred.
# Syntax checks are not behavioral tests. No coverage or security certification.
# No interactive GUI, platform matrix, or executable-build validation.
#
# Examples
# --------
# Edit 98_Tooling/ArchiveSnapshot/ or run this workflow manually from Actions.
#

name: 98 | Archive Snapshot | Python Tests

'on':
  push:
    branches:
      - main
    paths:
      - 98_Tooling/ArchiveSnapshot/**
      - .github/workflows/test-98-archive-snapshot.yml
  pull_request:
    branches:
      - main
    paths:
      - 98_Tooling/ArchiveSnapshot/**
      - .github/workflows/test-98-archive-snapshot.yml
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 | Syntax and regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: 98_Tooling/ArchiveSnapshot
    env:
      PYTHONUNBUFFERED: '1'
      REPORT_DIR: ${{ runner.temp }}/98-archive-snapshot-reports
      PROJECT_LABEL: 98 | Archive Snapshot | Python Tests
    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Prepare reports and show Python environment
        run: |
          mkdir -p "$REPORT_DIR"
          python --version

      - name: Install CI test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest --version

      - name: Check Python source syntax (does not execute application code)
        id: syntax
        run: |
          python - <<'PY'
          import os
          import tokenize
          from pathlib import Path

          excluded = {'.git', '.venv', 'venv', '__pycache__', 'build', 'dist',
                      'node_modules', 'PROJECT_CONTEXT_EXPORTS'}
          files = [p for p in sorted(Path('.').rglob('*.py'))
                   if not excluded.intersection(p.parts)]
          if not files:
              raise SystemExit('No Python source files found in the configured project.')
          errors = []
          for path in files:
              try:
                  with tokenize.open(path) as handle:
                      compile(handle.read(), str(path), 'exec')
              except (SyntaxError, UnicodeError, OSError) as exc:
                  errors.append(f'{path}: {exc}')
          report = f'Checked {len(files)} Python source files; syntax errors: {len(errors)}\n'
          report += '\n'.join(errors)
          print(report)
          (Path(os.environ['REPORT_DIR']) / 'syntax.txt').write_text(report, encoding='utf-8')
          if errors:
              raise SystemExit(1)
          PY

      - name: Collect tests and reject missing or broken suites
        id: collection
        run: |
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          set -o pipefail
          python -m pytest --collect-only -q 2>&1 | tee "$REPORT_DIR/collection.log"

      - name: Run all discovered tests with names, skip reasons, and timings
        id: tests
        run: |
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          set -o pipefail
          python -m pytest -vv -ra --tb=short --durations=20 --color=no \
            --junitxml="$REPORT_DIR/junit.xml" 2>&1 | tee "$REPORT_DIR/tests.log"

      - name: Publish result counts and reject all-skipped suites
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(os.environ['REPORT_DIR']) / 'junit.xml'
          if not path.exists():
              raise SystemExit('Test report missing; inspect the test step log.')
          root = ET.parse(path).getroot()
          cases = list(root.iter('testcase'))
          counts = {'tests': len(cases)}
          for tag in ('failure', 'error', 'skipped'):
              counts[tag] = sum(case.find(tag) is not None for case in cases)
          counts['passed'] = counts['tests'] - counts['failure'] - counts['error'] - counts['skipped']
          lines = ['## ' + os.environ['PROJECT_LABEL'], '',
                   '| Result | Count |', '| --- | ---: |']
          lines += [f'| {key} | {value} |' for key, value in counts.items()]
          lines += ['', 'Skipped includes pytest expected-failure outcomes, if present.',
                    'See the test log for names, reasons, and timings.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          if not cases or counts['tests'] == counts['skipped']:
              raise SystemExit('No non-skipped tests reported: refusing to report success.')
          PY

      - name: Save test logs and reports (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: 98-archive-snapshot-test-reports
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7

