# Purpose: Run the Encryption project's test suite whenever code under 97_Encryption changes.
# Communication / relationships: Runs automatically on GitHub Actions when changes are pushed
#   or a pull request is opened against files under 97_Encryption. Can also be triggered manually
#   from the GitHub Actions tab regardless of what changed, via workflow_dispatch. Reports
#   pass/fail status back to the commit/PR/run in the GitHub Actions tab; does not notify or
#   call any other workflow in this repository.
# Settings / parameters: Triggers on push/pull_request to `main` when the diff touches
#   `97_Encryption/**`, or at any time via manual "Run workflow" button. Python version pinned to
#   3.14. Working directory scoped to `97_Encryption`. PYTHONPATH is set to the working directory
#   itself so that top-level packages inside `97_Encryption` can be imported absolutely by test
#   files, matching how the project is run locally.
# Edge cases: pytest exit code 5 ("no tests collected") is treated as a pass, so projects
#   without a test suite report green instead of failing. Genuine test failures (exit code 1)
#   and collection/import errors (exit code 2) still fail the job. A commit that only touches
#   files outside `97_Encryption` will not auto-trigger this workflow - use "Run workflow" in the
#   Actions tab to force a run.
# Known limitations: Does not install project dependencies from requirements.txt - only
#   pytest itself is installed. If the project under test imports third-party packages,
#   those tests will fail with ModuleNotFoundError. Does not cache pip dependencies.
#   Does not run lint/type-check steps. Does not build or publish artifacts. Because exit
#   code 5 passes, a project that silently loses all its tests will still report green.
# Examples: Editing a file under `97_Encryption/` and pushing to `main` triggers this workflow
#   automatically; using "Run workflow" in the Actions tab triggers it regardless of what
#   changed.

name: Test Encryption

on:
  push:
    branches: [main]
    paths:
      - '97_Encryption/**'
  pull_request:
    branches: [main]
    paths:
      - '97_Encryption/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 97_Encryption
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          export PYTHONPATH="$PWD:$PYTHONPATH"
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice::No tests collected in 97_Encryption - treating as pass."
            exit 0
          fi
          exit "$code"
