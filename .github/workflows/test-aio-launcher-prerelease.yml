# Purpose: Run the AIO Launcher's test suite whenever code under aio-launcher-prerelease changes.
# Communication / relationships: Runs automatically on GitHub Actions when changes are pushed
#   or a pull request is opened against files under aio-launcher-prerelease. Reports pass/fail status
#   back to the commit/PR in the GitHub Actions tab; does not notify or call any other
#   workflow in this repository.
# Settings / parameters: Triggers only on push/pull_request to `main` when the diff touches
#   `aio-launcher-prerelease/**`. Python version pinned to 3.14. Working directory scoped to `aio-launcher-prerelease`.
#   PYTHONPATH is set to the working directory itself so that top-level packages inside
#   `aio-launcher-prerelease` (e.g. biometrics, crypto, vault, common, packages) can be imported absolutely
#   by test files, matching how the project is run locally.
# Edge cases: If no tests are collected, pytest exits non-zero (code 5) and the job is
#   reported as failed. If a test file itself has a genuine bug, PYTHONPATH will not mask it -
#   only import-path resolution is fixed here.
# Known limitations: Does not install project dependencies from requirements.txt - only
#   pytest itself is installed. If the project under test imports third-party packages,
#   those tests will fail with ModuleNotFoundError. Does not cache pip dependencies.
#   Does not run lint/type-check steps. Does not build or publish artifacts.
# Examples: Editing a file under `aio-launcher-prerelease/` and pushing to `main` triggers this workflow;
#   editing a file under any other top-level folder does not.

name: Test AIO Launcher (prerelease)

on:
  push:
    branches: [main]
    paths:
      - 'aio-launcher-prerelease/**'
  pull_request:
    branches: [main]
    paths:
      - 'aio-launcher-prerelease/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aio-launcher-prerelease
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          export PYTHONPATH="$PWD:$PYTHONPATH"
          pytest -q
