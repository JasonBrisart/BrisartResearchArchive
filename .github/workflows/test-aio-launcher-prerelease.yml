# Purpose: Run the AIO Launcher's test suite when code under aio-launcher-prerelease changes.
# Communication / relationships: Runs on GitHub Actions when files under aio-launcher-prerelease change,
#   when this workflow file itself changes, or on manual dispatch from the Actions tab.
#   Reports pass/fail back to the commit/PR; does not call any other workflow.
# Settings / parameters: Triggers on push/pull_request to `main` touching `aio-launcher-prerelease/**` or
#   `.github/workflows/test-aio-launcher-prerelease.yml`, plus manual `workflow_dispatch`. Python pinned to 3.14.
#   Working directory scoped to `aio-launcher-prerelease`. PYTHONPATH set to that directory so top-level
#   packages inside it import absolutely, matching local runs.
# Edge cases: pytest exit code 5 ("no tests collected") is treated as a pass so projects
#   without a test suite report green. Real failures (exit 1) and collection/import errors
#   (exit 2) still fail the job.
# Known limitations: Installs only pytest, not project dependencies. Does not cache pip,
#   lint, type-check, or build artifacts. A project that silently loses all its tests will
#   still report green because of the exit-5 rule.
# Examples: Editing anything under `aio-launcher-prerelease/` and pushing triggers this run; editing this
#   workflow file also triggers it, so changes can be validated immediately.

name: Test AIO Launcher (prerelease)

on:
  push:
    branches: [main]
    paths:
      - 'aio-launcher-prerelease/**'
      - '.github/workflows/test-aio-launcher-prerelease.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aio-launcher-prerelease/**'
      - '.github/workflows/test-aio-launcher-prerelease.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aio-launcher-prerelease
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          export PYTHONPATH="$PWD:$PYTHONPATH"
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice::No tests collected in aio-launcher-prerelease - treating as pass."
            exit 0
          fi
          exit "$code"
