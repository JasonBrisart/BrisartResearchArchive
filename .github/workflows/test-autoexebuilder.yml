# Purpose: Run AutoExeBuilder's test suite whenever code under 98_Tooling/AutoExeBuilder changes.
# Communication / relationships: Runs automatically on GitHub Actions when changes are pushed
#   or a pull request is opened against files under 98_Tooling/AutoExeBuilder. Can also be triggered manually
#   from the GitHub Actions tab regardless of what changed, via workflow_dispatch. Reports
#   pass/fail status back to the commit/PR/run in the GitHub Actions tab; does not notify or
#   call any other workflow in this repository.
# Settings / parameters: Triggers on push/pull_request to `main` when the diff touches
#   `98_Tooling/AutoExeBuilder/**`, or at any time via manual "Run workflow" button. Python version pinned to
#   3.14. Working directory scoped to `98_Tooling/AutoExeBuilder`. PYTHONPATH is set to the working directory
#   itself so that top-level packages inside `98_Tooling/AutoExeBuilder` can be imported absolutely by test
#   files, matching how the project is run locally.
# Edge cases: If no tests are collected, pytest exits non-zero (code 5) and the job is
#   reported as failed. A commit that only touches files outside `98_Tooling/AutoExeBuilder` will not
#   auto-trigger this workflow - use "Run workflow" in the Actions tab to force a run.
# Known limitations: Does not install project dependencies from requirements.txt - only
#   pytest itself is installed. If the project under test imports third-party packages,
#   those tests will fail with ModuleNotFoundError. Does not cache pip dependencies.
#   Does not run lint/type-check steps. Does not build or publish artifacts.
# Examples: Editing a file under `98_Tooling/AutoExeBuilder/` and pushing to `main` triggers this workflow
#   automatically; using "Run workflow" in the Actions tab triggers it regardless of what
#   changed.

name: Test AutoExeBuilder

on:
  push:
    branches: [main]
    paths:
      - '98_Tooling/AutoExeBuilder/**'
  pull_request:
    branches: [main]
    paths:
      - '98_Tooling/AutoExeBuilder/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 98_Tooling/AutoExeBuilder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          export PYTHONPATH="$PWD:$PYTHONPATH"
          pytest -q
